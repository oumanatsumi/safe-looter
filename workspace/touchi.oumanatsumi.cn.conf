# Nginx configuration for touchi.oumanatsumi.cn
# Place this file at: /etc/nginx/sites-available/touchi.oumanatsumi.cn.conf
# Then symlink: ln -s /etc/nginx/sites-available/touchi.oumanatsumi.cn.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name touchi.oumanatsumi.cn;

    # Increase upload size for admin operations
    client_max_body_size 10m;

    # ── Frontend static files ──
    root /opt/touchi/frontend;
    index index.html;

    # ── Access & error logs ──
    access_log /var/log/nginx/touchi.access.log;
    error_log  /var/log/nginx/touchi.error.log;

    # ── API ── proxy to Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # GIF generation can be slow
    }

    # ── Generated output files (GIFs) ──
    location /output/ {
        alias /opt/touchi/backend/output/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── Static resources (item images, expressions) ──
    location /resources/ {
        alias /opt/touchi/backend/resources/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── CSS ──
    location /css/ {
        alias /opt/touchi/frontend/css/;
        expires 7d;
    }

    # ── JS ──
    location /js/ {
        alias /opt/touchi/frontend/js/;
        expires 7d;
    }

    # ── SPA fallback ── serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
